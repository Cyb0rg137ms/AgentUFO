[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentufo-studio"
version = "0.1.0"
description = "Local-first multi-agent developer studio and workspace sandbox"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentufo = "run_web_ui:main"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.11", "bandit>=1.7", "build>=1.2"]
qdit = ["numpy>=1.24,<3"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.setuptools.packages.find]
include = ["agent_core*", "server*", "web*"]

[tool.setuptools]
py-modules = ["run_web_ui"]

[tool.setuptools.package-data]
web = ["index.html", "css/*.css", "js/*.js"]
